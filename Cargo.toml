[package]
name = "bubbledesk"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/NHWK-cpu/BubbleDesk"
description = "Wallpaper hidup berisi bubble untuk item desktop Windows."

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
winit = "0.30"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
serde_json = "1"
notify = { version = "7", default-features = false }
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
fontdue = "0.9.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
